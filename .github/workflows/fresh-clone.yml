# No latest/global fallback: all jobs use the reviewed lock and checksum.
name: Fresh clone pinned quick start
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  quickstart:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install locked project-local MoonBit SDK
        env:
          MOON_HOME: ${{ github.workspace }}/.toolchains/fresh-sdk
        run: |
          python3 scripts/install-ci-sdk.py --dest "$MOON_HOME"
          echo "MOON_HOME=$MOON_HOME" >> "$GITHUB_ENV"
          echo "MOONABNF_SDK=$MOON_HOME" >> "$GITHUB_ENV"
          echo "$MOON_HOME/bin" >> "$GITHUB_PATH"
      - run: moon version --all
      - run: moon check --deny-warn
      - run: moon test
      - name: Public API examples
        run: |
          moon test --target js
          moon run examples --target js
          moon run examples/scalar_prose --target native
          moon run examples/protocols/cmd --target js > "$RUNNER_TEMP/protocols.txt"
          diff -u examples/protocols/cmd/expected_output.txt "$RUNNER_TEMP/protocols.txt"
          moon run examples/request_line/cmd --target js > "$RUNNER_TEMP/request_line.txt"
          diff -u examples/request_line/cmd/expected_output.txt "$RUNNER_TEMP/request_line.txt"
      - name: Formatting and generated interfaces are up to date
        run: |
          moon fmt --check
          moon info
          git diff --exit-code -- '*.mbti'
